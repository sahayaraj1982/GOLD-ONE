<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary Accounts Dashboard</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1a252f;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --primary-blue: #2980b9;
            --border-color: #bdc3c7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1250px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 24px;
            font-weight: 800;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            color: #2c3e50;
        }

        .total-count-badge {
            background: #2c3e50;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .led {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
            transition: all 0.3s ease;
        }

        .led.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 140px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 800;
            color: #1a252f;
            text-align: left;
        }

        input[type="date"], input[type="text"], input[type="tel"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            font-weight: 700;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border: 2px solid var(--primary-blue);
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
            text-transform: uppercase;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f39c12, #d35400);
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }

        .search-bar {
            margin: 15px 0 10px 0;
        }

        .table-container {
            margin-top: 10px;
            max-height: 350px;
            overflow-y: auto;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            text-align: left;
            font-size: 12.5px; /* எழுத்துக்கள் பொருத்தமான அளவில் சிறியதாக்கப்பட்டுள்ளது */
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 8px 6px; /* இடைவெளி குறைக்கப்பட்டு அனைத்து காலமும் தெரிய வழி செய்யப்பட்டுள்ளது */
            position: sticky;
            top: 0;
            z-index: 2;
            font-weight: 800;
            white-space: nowrap;
        }

        td {
            padding: 8px 6px; /* இடைவெளி குறைக்கப்பட்டு அனைத்து காலமும் தெரிய வழி செய்யப்பட்டுள்ளது */
            border-bottom: 1px solid var(--border-color);
            color: #0f172a;
            font-weight: 700;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .btn-edit, .btn-delete {
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 800;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2>Diary Accounts Dashboard</h2>

    <div class="header-panel">
        <div class="status-indicator">
            <div id="ledIndicator" class="led"></div>
            <span id="statusText">Connecting...</span>
        </div>
        <div class="total-count-badge" id="totalCountBadge">Total Entries: 0</div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="entryDate">
        </div>
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="entryName" placeholder="Name">
        </div>
        <div class="form-group">
            <label>Mobile</label>
            <input type="tel" id="entryPhone" placeholder="Mobile">
        </div>
        <div class="form-group">
            <label>Details</label>
            <input type="text" id="entryDetails" placeholder="Details">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="entryEmail" placeholder="Email">
        </div>
    </div>

    <button class="btn-action" id="submitBtn" onclick="addEntry()">Save Entry</button>

    <div class="btn-group">
        <button class="btn-action btn-secondary" onclick="exportData()">Export</button>
        <button class="btn-action btn-secondary" onclick="document.getElementById('importFile').click()">Import</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        <button class="btn-action btn-danger" onclick="allDelete()">All Delete</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by Name / Mobile..." onkeyup="filterList()">
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>DATE</th>
                    <th>NAME</th>
                    <th>MOBILE</th>
                    <th>DETAILS</th>
                    <th>EMAIL</th>
                    <th>EDIT</th>
                    <th>DELETE</th>
                </tr>
            </thead>
            <tbody id="listContainer">
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqsao9noUByq9EG3iXoBvqss8eKMoj7Na8I6VXS-0nJyAovV8A8Vz5DND0zSaaVg5D/exec";
    let entries = [];
    let editIndex = -1;

    window.onload = function() {
        loadDataFromSheet();
    };

    function formatDateToIndian(dateString) {
        if (!dateString) return '';
        let cleanStr = dateString.toString().split('T')[0];
        let parts = cleanStr.split('-');
        if (parts.length === 3) {
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        return cleanStr;
    }

    function loadDataFromSheet() {
        const led = document.getElementById('ledIndicator');
        const statusText = document.getElementById('statusText');

        fetch(SCRIPT_URL + "?t=" + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                if (Array.isArray(data)) {
                    entries = data;
                    // பழைய தேதி முதலில் வருமாறு வரிசைப்படுத்துதல் (Oldest First)
                    entries.sort((a, b) => new Date(a.date) - new Date(b.date));
                    renderList(entries);
                    led.classList.add('connected');
                    statusText.innerText = "Google Sheet Connected";
                }
            })
            .catch(error => {
                console.error('Error loading data:', error);
                led.classList.remove('connected');
                statusText.innerText = "Connection Failed";
            });
    }

    function addEntry() {
        const date = document.getElementById('entryDate').value;
        const name = document.getElementById('entryName').value;
        const phone = document.getElementById('entryPhone').value;
        const details = document.getElementById('entryDetails').value;
        const email = document.getElementById('entryEmail').value;

        if(!date || !name || !phone) {
            alert("Date, Name, and Mobile are required!");
            return;
        }

        const entryObj = { date, name, phone, details, email };

        if (editIndex === -1) {
            entries.push(entryObj);
            alert("Entry saved successfully!");
        } else {
            entries[editIndex] = entryObj;
            editIndex = -1;
            document.getElementById('submitBtn').innerText = "Save Entry";
            alert("Record updated successfully!");
        }

        entries.sort((a, b) => new Date(a.date) - new Date(b.date));

        syncWithSheet();
        clearForm();
        renderList(entries);
    }

    function syncWithSheet() {
        const led = document.getElementById('ledIndicator');
        const statusText = document.getElementById('statusText');

        const rawData = JSON.stringify(entries);
        const formData = new URLSearchParams();
        formData.append("data", rawData);

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formData
        }).then(() => {
            led.classList.add('connected');
            statusText.innerText = "Google Sheet Connected";
        }).catch(error => {
            console.error('Error syncing:', error);
            led.classList.remove('connected');
            statusText.innerText = "Connection Failed";
        });
    }

    function clearForm() {
        document.getElementById('entryDate').value = '';
        document.getElementById('entryName').value = '';
        document.getElementById('entryPhone').value = '';
        document.getElementById('entryDetails').value = '';
        document.getElementById('entryEmail').value = '';
        editIndex = -1;
        document.getElementById('submitBtn').innerText = "Save Entry";
    }

    function renderList(dataArray) {
        const container = document.getElementById('listContainer');
        container.innerHTML = '';

        document.getElementById('totalCountBadge').innerText = `Total Entries: ${entries.length}`;

        if(dataArray.length === 0) {
            container.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#7f8c8d; padding:20px;">No records found</td></tr>';
            return;
        }

        dataArray.forEach((item) => {
            const originalIndex = entries.indexOf(item);
            let displayDate = formatDateToIndian(item.date);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${displayDate}</td>
                <td>${item.name || ''}</td>
                <td>${item.phone || ''}</td>
                <td>${item.details || ''}</td>
                <td>${item.email || ''}</td>
                <td><button class="btn-edit" onclick="editEntry(${originalIndex})">Edit</button></td>
                <td><button class="btn-delete" onclick="deleteEntry(${originalIndex})">Delete</button></td>
            `;
            container.appendChild(tr);
        });
    }

    function editEntry(index) {
        const item = entries[index];
        let cleanDate = item.date ? item.date.toString().split('T')[0] : '';
        document.getElementById('entryDate').value = cleanDate;
        document.getElementById('entryName').value = item.name || '';
        document.getElementById('entryPhone').value = item.phone || '';
        document.getElementById('entryDetails').value = item.details || '';
        document.getElementById('entryEmail').value = item.email || '';
        editIndex = index;
        document.getElementById('submitBtn').innerText = "Update Entry";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(index) {
        if(confirm("Are you sure you want to delete this record?")) {
            entries.splice(index, 1);
            syncWithSheet();
            renderList(entries);
            if (editIndex === index) {
                clearForm();
            } else if (editIndex > index) {
                editIndex--;
            }
        }
    }

    function allDelete() {
        if (entries.length === 0) {
            alert("No data to delete!");
            return;
        }

        if (confirm("Do you want to delete all records? A backup file will be downloaded first.")) {
            let fileName = prompt("Enter backup file name:", "diary_backup");
            if (fileName) {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", fileName + ".json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();

                entries = [];
                syncWithSheet();
                renderList(entries);
                clearForm();
                alert("All records downloaded and deleted successfully!");
            }
        }
    }

    function exportData() {
        if (entries.length === 0) {
            alert("No data to export!");
            return;
        }
        let fileName = prompt("Enter file name:", "diary_data");
        if (fileName) {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", fileName + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    entries = importedData;
                    entries.sort((a, b) => new Date(a.date) - new Date(b.date));
                    syncWithSheet();
                    renderList(entries);
                    clearForm();
                    alert("Data imported successfully and synced to Google Sheet!");
                } else {
                    alert("Invalid file format!");
                }
            } catch (error) {
                alert("Error reading file!");
            }
        };
        reader.readAsText(file);
    }

    function filterList() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = entries.filter(item => 
            (item.name && item.name.toLowerCase().includes(query)) || 
            (item.phone && item.phone.toLowerCase().includes(query))
        );
        renderList(filtered);
    }
</script>

</body>
</html>
