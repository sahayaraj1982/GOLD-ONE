<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRCTC NAME LIST</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:linear-gradient(135deg,#eaf4ff,#f8f1ff);color:#17212b;font-family:Segoe UI,Arial,sans-serif;font-size:16px}
.container{width:75%;max-width:1500px;min-width:920px;margin:auto;background:#fff;border-radius:14px;box-shadow:0 5px 25px rgba(0,0,0,.15);overflow:hidden}
.header{position:relative;background:linear-gradient(135deg,#123b63,#0b5d8f);color:#fff;padding:18px 22px;text-align:center}
.header h2{margin:0;font-size:25px;letter-spacing:.5px}
.status{position:absolute;right:18px;top:15px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}
.led{width:13px;height:13px;border-radius:50%;background:#777;box-shadow:0 0 4px #555}
.led.green{background:#18d65a;box-shadow:0 0 8px #18d65a,0 0 16px rgba(24,214,90,.7)}
.led.red{background:#ff3434;box-shadow:0 0 8px #ff3434}
#loadingStatus{display:none;position:absolute;left:18px;top:15px;background:#fff3cd;color:#704f00;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:800}
.form{padding:18px;display:grid;grid-template-columns:1fr 1.25fr 1fr 1.4fr 1.6fr;gap:12px;background:#f8fbff;border-bottom:1px solid #dbe4ee}
.field{display:flex;flex-direction:column;min-width:0}
label{font-size:13px;font-weight:800;margin-bottom:5px;color:#263746}
input{width:100%;min-height:43px;padding:9px 11px;border:1px solid #b8c6d4;border-radius:7px;background:#fff;color:#111;font-size:16px;font-weight:600;outline:none}
input:focus{border-color:#1677b9;box-shadow:0 0 0 3px rgba(22,119,185,.12)}
.save{grid-column:1/-1;min-height:45px;border:0;border-radius:8px;background:#168447;color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.save:hover{background:#106b39}
.searchPanel{padding:14px 18px;background:#fff;border-bottom:1px solid #dbe4ee}
.searchGrid{display:grid;grid-template-columns:1fr 1.15fr 1.25fr 2.2fr auto;gap:10px;align-items:end}
.searchBox label{font-size:12px}
.searchBox input{min-height:42px;font-size:15px}
.searchBtn{min-height:42px;padding:0 22px;border:0;border-radius:7px;background:#123b63;color:#fff;font-size:15px;font-weight:900;cursor:pointer}
.toolbar{padding:12px 18px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;background:linear-gradient(90deg,#f7fbff,#eef5ff);border-bottom:1px solid #d3dfeb}
.tool{min-height:46px;width:100%;border:0;border-radius:8px;color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 3px 7px rgba(0,0,0,.14);letter-spacing:.2px}
.tool:hover{transform:translateY(-1px);filter:brightness(1.05)}
.tool.local{background:#1976d2;opacity:.38}.tool.google{background:#0b9b55;opacity:.38}
.tool.local.active{opacity:1;box-shadow:0 0 0 3px rgba(25,118,210,.28),0 4px 10px rgba(25,118,210,.35)}
.tool.google.active{opacity:1;box-shadow:0 0 0 3px rgba(11,155,85,.28),0 4px 10px rgba(11,155,85,.35)}
.tool.import{background:#7b4fc6}.tool.export{background:#ed8b16}.tool.script{background:#d14d86}.tool.danger{background:#d52f3e}
.infoBar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:#eef5fb;font-weight:800}
.emptyState{padding:28px 12px;text-align:center;font-size:18px;font-weight:900;color:#697785;background:#fafcff}
.count{font-size:16px}.note{font-size:13px;color:#526270}
.tableWrap{width:100%;overflow-x:auto}
table{width:100%;min-width:980px;table-layout:fixed;border-collapse:collapse}
th{background:#164f82;color:#fff;padding:12px 9px;text-align:left;font-size:15px;font-weight:900;white-space:nowrap}
td{padding:11px 9px;border-bottom:1px solid #dfe5eb;font-size:16px;font-weight:650;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#edf6ff}
.dateCell{color:#b00020;font-weight:900;text-align:center}
.nameCell{color:#111;font-weight:900}
.actionCell{text-align:center;overflow:visible;white-space:nowrap}
.actionBtn{display:inline-block;padding:6px 9px;margin:0 2px;border-radius:5px;border:1px solid;font-size:12px;font-weight:900;cursor:pointer}
.editBtn{background:#e9f2ff;color:#07539b;border-color:#9dbfe5}
.deleteBtn{background:#fff0f0;color:#a00000;border-color:#e3a1a1}
th:nth-child(1),td:nth-child(1){width:115px}
th:nth-child(2),td:nth-child(2){width:180px}
th:nth-child(3),td:nth-child(3){width:135px}
th:nth-child(4),td:nth-child(4){width:205px}
th:nth-child(5),td:nth-child(5){width:300px}
th:nth-child(6),td:nth-child(6){width:150px}
td:nth-child(5){white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;line-height:1.25}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:center;justify-content:center;padding:18px}
.modalBox{width:min(560px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modalBox h3{margin:0 0 12px;color:#123b63}
.modalBox textarea{width:100%;min-height:310px;resize:vertical;padding:12px;border:1px solid #9db0c0;border-radius:7px;font-family:Consolas,monospace;font-size:13px}
.modalButtons{display:flex;gap:10px;margin-top:12px}
.modalButtons button{flex:1;min-height:43px;border:0;border-radius:7px;font-weight:900;cursor:pointer}
.copyBtn{background:#168447;color:#fff}.closeBtn{background:#dfe5eb;color:#17232e}
@media(max-width:1000px){.toolbar{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
body{padding:8px;font-size:15px}.container{width:100%;min-width:0}.header h2{font-size:21px}
.status{position:static;justify-content:center;margin-top:8px}
#loadingStatus{position:static;display:none;margin:7px auto 0;width:max-content}
.form{grid-template-columns:1fr 1fr}.searchGrid{grid-template-columns:1fr 1fr}
.searchGrid .searchBox.gmail{grid-column:1/-1}.searchBtn{width:100%}
.toolbar{grid-template-columns:1fr 1fr}.toolbar .tool:last-child{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h2>IRCTC NAME LIST <span id="countDisplay">(0)</span></h2>
<div id="loadingStatus">ஒத்திசைக்கப்படுகிறது...</div>
<div class="status"><span id="led" class="led"></span><span id="connectionText">GOOGLE NOT CONNECTED</span></div>
</div>

<div class="form">
<div class="field"><label>DATE</label><input type="date" id="tDate"></div>
<div class="field"><label>NAME</label><input type="text" id="tName"></div>
<div class="field"><label>MOBILE</label><input type="tel" id="tPhone"></div>
<div class="field"><label>DETAILS</label><input type="text" id="tDetails"></div>
<div class="field"><label>GMAIL / MOBILE</label><input type="text" id="tEmail" placeholder="Gmail அல்லது Mobile"></div>
<button class="save" id="mainBtn" onclick="handleData()">SAVE ENTRY</button>
</div>

<div class="searchPanel">
<div class="searchGrid">
<div class="searchBox"><label>NAME SEARCH</label><input id="findName" type="text"></div>
<div class="searchBox"><label>MOBILE SEARCH</label><input id="findPhone" type="text"></div>
<div class="searchBox"><label>DETAILS SEARCH</label><input id="findDetails" type="text"></div>
<div class="searchBox gmail"><label>GMAIL / MOBILE SEARCH</label><input id="findGmail" type="text"></div>
<button class="searchBtn" onclick="drawTable()">SEARCH</button>
</div>
</div>

<div class="toolbar">
<button class="tool local" onclick="setMode('local')">LOCAL</button>
<button class="tool google" onclick="setMode('google')">GOOGLE SHEET</button>
<button class="tool import" onclick="doImport()">IMPORT</button>
<button class="tool export" onclick="doExport()">EXPORT</button>
<button class="tool script" onclick="openScriptModal()">SCRIPT COPY</button>
<button class="tool danger" onclick="deleteAllWithBackup()">ALL DELETE</button>

</div>

<div class="infoBar"><div class="count">TOTAL RECORDS: <span id="totalDisplay">0</span></div><div class="note">தேதி வடிவம்: DD/MM/YYYY</div></div>

<div class="tableWrap">
<table>
<thead><tr><th>DATE</th><th>NAME</th><th>MOBILE</th><th>DETAILS</th><th>GMAIL / MOBILE</th><th>ACTION</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>

<div id="scriptModal" class="modal">
<div class="modalBox">
<h3>GOOGLE SHEET APPS SCRIPT</h3>
<p style="font-weight:700">Google Sheet → Extensions → Apps Script-ல் கீழே உள்ள code-ஐ paste செய்து Web app ஆக Deploy செய்யவும்.</p>
<textarea id="scriptText" readonly></textarea>
<div class="modalButtons">
<button class="copyBtn" onclick="copyGoogleScript()">COPY SCRIPT</button>
<button class="closeBtn" onclick="closeScriptModal()">CLOSE</button>
</div>
</div>
</div>

<script>
/* =========================================================
   GOOGLE SHEET URL - இங்கே மட்டும் உங்கள் URL-ஐ paste செய்யவும்.
   எந்த Google URL-மும் இந்த file-ல் முன்கூட்டியே சேர்க்கப்படவில்லை.

   உதாரணம்:
   const CLOUD_URL = "https://script.google.com/macros/s/....../exec";
   ========================================================= */
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbyKIt-dudAzTLcv7e6QxCtkYUNrZ_miyfSN-sg8gbv3T67xBSo1DYH0bfCuqFyKP30WyA/exec";

let database = JSON.parse(localStorage.getItem("proAccountDB") || "[]");
let editID = null;

const GOOGLE_SCRIPT = `
function doGet(e) {
  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("DATA");
  if (!sh) {
    sh = SpreadsheetApp.getActiveSpreadsheet().insertSheet("DATA");
    sh.appendRow(["Date","Name","Mobile","Details","GmailMobile"]);
  }

  var values = sh.getDataRange().getValues();
  if (values.length <= 1) {
    return ContentService.createTextOutput("[]")
      .setMimeType(ContentService.MimeType.JSON);
  }

  var out = [];
  for (var i = 1; i < values.length; i++) {
    out.push({
      date: formatDate(values[i][0]),
      name: String(values[i][1] || ""),
      phone: String(values[i][2] || ""),
      details: String(values[i][3] || ""),
      email: String(values[i][4] || "")
    });
  }

  return ContentService.createTextOutput(JSON.stringify(out))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("DATA");
  if (!sh) {
    sh = SpreadsheetApp.getActiveSpreadsheet().insertSheet("DATA");
    sh.appendRow(["Date","Name","Mobile","Details","GmailMobile"]);
  }

  var data = JSON.parse(e.parameter.data || "[]");

  if (sh.getLastRow() > 1) {
    sh.getRange(2,1,sh.getLastRow()-1,5).clearContent();
  }

  if (data.length) {
    var rows = data.map(function(x) {
      return [x.date || "", x.name || "", x.phone || "", x.details || "", x.email || ""];
    });
    sh.getRange(2,1,rows.length,5).setValues(rows);
  }

  return ContentService.createTextOutput(JSON.stringify({ok:true}))
    .setMimeType(ContentService.MimeType.JSON);
}

function formatDate(v) {
  if (!v) return "";
  if (Object.prototype.toString.call(v) === "[object Date]") {
    return Utilities.formatDate(v, Session.getScriptTimeZone(), "yyyy-MM-dd");
  }
  return String(v);
}
`;

function toggleLoading(show){document.getElementById("loadingStatus").style.display=show?"block":"none"}

function setGoogleStatus(state,text){
const led=document.getElementById("led"); led.className="led";
if(state==="green")led.classList.add("green");
if(state==="red")led.classList.add("red");
document.getElementById("connectionText").textContent=text;
}

function formatDateDisplay(v){
if(!v)return "";
const s=String(v).substring(0,10).split("-");
if(s.length===3&&s[0].length===4)return s[2]+"/"+s[1]+"/"+s[0];
return v;
}

function normalizeDate(v){
if(!v)return "";
const s=String(v).substring(0,10);
if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
const m=s.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})$/);
if(m)return m[3]+"-"+m[2]+"-"+m[1];
return s;
}

function saveLocal(){localStorage.setItem("proAccountDB",JSON.stringify(database))}

function clearInput(){
["tDate","tName","tPhone","tDetails","tEmail"].forEach(id=>document.getElementById(id).value="");
}

function escapeHTML(v){
return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function handleData(){
const d=document.getElementById("tDate").value;
const n=document.getElementById("tName").value.trim();
const p=document.getElementById("tPhone").value.trim();
const dt=document.getElementById("tDetails").value.trim();
const em=document.getElementById("tEmail").value.trim();

if(!d||!n){alert("DATE மற்றும் NAME கட்டாயம்.");return}

const obj={date:normalizeDate(d),name:n,phone:p,details:dt,email:em};

if(editID===null)database.push(obj);
else{database[editID]=obj;editID=null;document.getElementById("mainBtn").textContent="SAVE ENTRY"}

database.sort((a,b)=>normalizeDate(a.date).localeCompare(normalizeDate(b.date)));
if(currentMode==="local") saveLocal();
drawTable();clearInput();
}

function goEdit(i){
const x=database[i];if(!x)return;
document.getElementById("tDate").value=normalizeDate(x.date);
document.getElementById("tName").value=x.name||"";
document.getElementById("tPhone").value=x.phone||"";
document.getElementById("tDetails").value=x.details||"";
document.getElementById("tEmail").value=x.email||"";
editID=i;document.getElementById("mainBtn").textContent="UPDATE ENTRY";
window.scrollTo({top:0,behavior:"smooth"});
}

function drawTable(){
const body=document.getElementById("tableBody");
const nameF=document.getElementById("findName").value.trim().toLowerCase();
const phoneF=document.getElementById("findPhone").value.trim().toLowerCase();
const detailsF=document.getElementById("findDetails").value.trim().toLowerCase();
const gmailF=document.getElementById("findGmail").value.trim().toLowerCase();
body.innerHTML="";

let shown=0;
database.forEach((item,index)=>{
const name=String(item.name||"").toLowerCase();
const phone=String(item.phone||"").toLowerCase();
const details=String(item.details||"").toLowerCase();
const email=String(item.email||"").toLowerCase();

const ok=(!nameF||name.includes(nameF))&&
(!phoneF||phone.includes(phoneF))&&
(!detailsF||details.includes(detailsF))&&
(!gmailF||email.includes(gmailF)||phone.includes(gmailF));

if(!ok)return;
shown++;

body.insertAdjacentHTML("beforeend",`
<tr>
<td class="dateCell">${escapeHTML(formatDateDisplay(item.date))}</td>
<td class="nameCell" title="${escapeHTML(item.name)}">${escapeHTML(item.name)}</td>
<td title="${escapeHTML(item.phone)}">${escapeHTML(item.phone)}</td>
<td title="${escapeHTML(item.details)}">${escapeHTML(item.details)}</td>
<td title="${escapeHTML(item.email)}">${escapeHTML(item.email)}</td>
<td class="actionCell">
<button class="actionBtn editBtn" onclick="goEdit(${index})">EDIT</button>
<button class="actionBtn deleteBtn" onclick="deleteOneWithBackup(${index})">DELETE</button>
</td>
</tr>`);
});

if(shown===0){
  const message = currentMode === "google" ? "NO DATA — GOOGLE SHEET" : "NO DATA — LOCAL";
  body.innerHTML=`<tr><td colspan="6"><div class="emptyState">${message}</div></td></tr>`;
}

document.getElementById("countDisplay").textContent="("+shown+")";
document.getElementById("totalDisplay").textContent=shown;
}

["findName","findPhone","findDetails","findGmail"].forEach(id=>{
document.getElementById(id).addEventListener("input",drawTable);
});

function csvEscape(v){return '"'+String(v??"").replace(/"/g,'""')+'"'}

function makeCSV(){
let csv="Date,Name,Mobile,Details,GmailMobile\n";
database.forEach(r=>{
csv+=[r.date||"",r.name||"",r.phone||"",r.details||"",r.email||""].map(csvEscape).join(",")+"\r\n";
});
return csv;
}

function downloadBackup(filename){
const blob=new Blob([makeCSV()],{type:"text/csv;charset=utf-8"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");a.href=url;a.download=filename;
document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function askBackupFilename(){
const defaultName="IRCTC_BACKUP_"+new Date().toISOString().slice(0,10)+".csv";
const entered=prompt("Delete செய்வதற்கு முன் Backup download செய்யப்படும்.\n\nFile name கொடுக்கவும்:",defaultName);
if(entered===null)return null;
let name=entered.trim();if(!name)return null;
if(!/\.csv$/i.test(name))name+=".csv";
return name;
}

function deleteOneWithBackup(index){
if(!database[index])return;
const filename=askBackupFilename();
if(!filename){alert("Backup file name கொடுக்கப்படவில்லை. Delete நிறுத்தப்பட்டது.");return}
downloadBackup(filename);
if(!confirm("Backup download தொடங்கியது. இப்போது இந்த entry-ஐ Delete செய்யலாமா?"))return;
database.splice(index,1);saveLocal();drawTable();
}

function deleteAllWithBackup(){
if(database.length===0){alert("Delete செய்ய data இல்லை.");return}
const filename=askBackupFilename();
if(!filename){alert("Backup file name கொடுக்கப்படவில்லை. ALL DELETE நிறுத்தப்பட்டது.");return}
downloadBackup(filename);
if(!confirm("Backup download தொடங்கியது.\n\n"+database.length+" records அனைத்தையும் Delete செய்யலாமா?"))return;
database=[];editID=null;saveLocal();clearInput();
document.getElementById("mainBtn").textContent="SAVE ENTRY";
drawTable();alert("ALL DATA DELETE செய்யப்பட்டது.");
}

function exportLocal(){
if(database.length===0){alert("Local data இல்லை.");return}
const filename=prompt("Local Export file name:","IRCTC_LOCAL_BACKUP_"+new Date().toISOString().slice(0,10)+".csv");
if(!filename)return;
downloadBackup(/\.csv$/i.test(filename)?filename:filename+".csv");
}

function parseCSV(text){
  text = String(text || "").replace(/^\uFEFF/, "");
  const firstLine = text.split(/\r?\n/)[0] || "";
  const delimiter = firstLine.includes("\t") && !firstLine.includes(",") ? "\t" : ",";
  const rows = [];
  let row = [], cell = "", quoted = false;

  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c === '"'){
      if(quoted && text[i+1] === '"'){ cell += '"'; i++; }
      else quoted = !quoted;
    }else if(c === delimiter && !quoted){
      row.push(cell); cell = "";
    }else if((c === "\n" || c === "\r") && !quoted){
      if(c === "\r" && text[i+1] === "\n") i++;
      row.push(cell);
      if(row.some(v => String(v).trim() !== "")) rows.push(row);
      row = []; cell = "";
    }else{
      cell += c;
    }
  }
  if(cell !== "" || row.length){
    row.push(cell);
    if(row.some(v => String(v).trim() !== "")) rows.push(row);
  }

  if(!rows.length) return [];

  const headers = rows[0].map(x => String(x).trim().toLowerCase().replace(/^\uFEFF/,""));
  return rows.slice(1).map(r => {
    const o = {};
    headers.forEach((h,i) => o[h] = String(r[i] ?? "").trim());
    return {
      date: o.date || o["date (dd/mm/yyyy)"] || "",
      name: o.name || "",
      phone: o.mobile || o.phone || "",
      details: o.details || o.detail || "",
      email: o.gmailmobile || o["gmail / mobile"] || o.email || o.gmail || ""
    };
  });
}

function cleanRecord(x){
return{
date:normalizeDate(x.date||x.Date||""),
name:String(x.name||x.Name||""),
phone:String(x.phone||x.Mobile||""),
details:String(x.details||x.Details||""),
email:String(x.email||x.GmailMobile||x.Email||"")
};
}

function importLocal(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const text = String(e.target.result || "");
      let imported = [];

      if(file.name.toLowerCase().endsWith(".json")){
        const data = JSON.parse(text.replace(/^\uFEFF/,""));
        if(!Array.isArray(data)) throw new Error("JSON file format is not valid.");
        imported = data.map(cleanRecord);
      }else{
        imported = parseCSV(text).map(cleanRecord);
      }

      imported = imported.filter(x => x.date || x.name || x.phone || x.details || x.email);

      if(!imported.length){
        throw new Error("File-ல் valid data கிடைக்கவில்லை.");
      }

      if(currentMode !== "local"){
        alert("IMPORT file என்பது LOCAL mode-ல் மட்டும் வேலை செய்யும். Google mode-ல் IMPORT அழுத்தினால் Google Sheet data வரும்.");
        return;
      }

      database = imported;
      saveLocal();
      drawTable();
      alert(imported.length + " records LOCAL-ல் import செய்யப்பட்டது.");
    }catch(err){
      console.error(err);
      alert("IMPORT FAILED\n\n" + err.message);
    }finally{
      event.target.value = "";
    }
  };
  reader.readAsText(file);
}

let currentMode = localStorage.getItem("irctcMode") || "local";

function updateModeButtons(){
  document.querySelector(".tool.local").classList.toggle("active", currentMode === "local");
  document.querySelector(".tool.google").classList.toggle("active", currentMode === "google");
}

function setMode(mode){
  currentMode = mode;
  localStorage.setItem("irctcMode", mode);
  updateModeButtons();

  if(mode === "local"){
    setGoogleStatus("","LOCAL MODE");
    loadLocalOnly();
  }else{
    // Google mode must NEVER display Local Storage data.
    database = [];
    drawTable();
    if(!googleConfigured()){
      setGoogleStatus("red","GOOGLE NOT CONNECTED");
      return;
    }
    checkGoogleConnection();
  }
}

function doImport(){
  if(currentMode === "local"){
    document.getElementById("impFile").click();
  }else{
    importGoogle();
  }
}

function doExport(){
  if(currentMode === "local"){
    exportLocal();
  }else{
    exportGoogle();
  }
}

function loadLocalOnly(){
  database = JSON.parse(localStorage.getItem("proAccountDB") || "[]");
  drawTable();
}

function googleConfigured(){
return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec\/?$/.test(CLOUD_URL.trim());
}

async function googleGet(){
  if(!googleConfigured()) throw new Error("CLOUD_URL அமைக்கப்படவில்லை.");
  const url = CLOUD_URL + (CLOUD_URL.includes("?") ? "&" : "?") + "_=" + Date.now();
  const res = await fetch(url, {method:"GET", mode:"cors", cache:"no-store"});
  if(!res.ok) throw new Error("Google server error: " + res.status);
  const data = await res.json();
  if(!Array.isArray(data)) throw new Error("Google response data சரியாக இல்லை.");
  return data.map(cleanRecord);
}

async function googlePost(dataToSend){
  if(!googleConfigured()) throw new Error("CLOUD_URL அமைக்கப்படவில்லை.");

  // URL-encoded POST avoids a CORS preflight with Apps Script.
  const body = "data=" + encodeURIComponent(JSON.stringify(dataToSend));
  await fetch(CLOUD_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
    body:body
  });
}

async function exportGoogle(){
  if(!googleConfigured()){
    alert("முதலில் HTML-ல் CLOUD_URL இடத்தில் உங்கள் Google Apps Script Web App URL-ஐ மட்டும் paste செய்யவும்.");
    setGoogleStatus("red","GOOGLE NOT CONNECTED");
    return;
  }

  if(currentMode !== "google"){
    alert("முதலில் GOOGLE SHEET button-ஐ select செய்யவும்.");
    return;
  }

  if(database.length===0){
    alert("Google-க்கு அனுப்ப data இல்லை.");
    return;
  }

  toggleLoading(true);
  try{
    await googlePost(database);
    await new Promise(r=>setTimeout(r,800));
    const verify = await googleGet();
    database = verify;
    setGoogleStatus("green","GOOGLE CONNECTED");
    drawTable();
    alert("Google Sheet update முடிந்தது.");
  }catch(err){
    console.error(err);
    setGoogleStatus("red","GOOGLE ERROR");
    alert("Google Sheet update செய்ய முடியவில்லை.\n\n"+err.message);
  }finally{
    toggleLoading(false);
  }
}

async function importGoogle(showAlert=true){
  if(!googleConfigured()){
    alert("முதலில் HTML-ல் CLOUD_URL இடத்தில் உங்கள் Google Apps Script Web App URL-ஐ மட்டும் paste செய்யவும்.");
    setGoogleStatus("red","GOOGLE NOT CONNECTED");
    return [];
  }

  if(currentMode !== "google"){
    setMode("google");
    return [];
  }

  toggleLoading(true);
  try{
    const data = await googleGet();
    database = data;
    drawTable();
    setGoogleStatus("green","GOOGLE CONNECTED");
    if(showAlert) alert(data.length ? (data.length+" records Google Sheet-ல் இருந்து வந்தது.") : "NO DATA — GOOGLE SHEET");
    return data;
  }catch(err){
    console.error(err);
    database = [];
    drawTable();
    setGoogleStatus("red","GOOGLE NOT CONNECTED");
    if(showAlert) alert("Google Sheet data பெற முடியவில்லை.\n\n"+err.message);
    return [];
  }finally{
    toggleLoading(false);
  }
}

async function checkGoogleConnection(){
  if(!googleConfigured()){
    setGoogleStatus("red","GOOGLE NOT CONNECTED");
    return;
  }

  toggleLoading(true);
  try{
    const googleData = await googleGet();

    // IMPORTANT:
    // Google mode never displays Local Storage data.
    // If Google Sheet is empty, only then automatically upload the existing
    // Local Storage data as the first-time migration.
    if(googleData.length === 0){
      const localData = JSON.parse(localStorage.getItem("proAccountDB") || "[]").map(cleanRecord);
      if(localData.length > 0){
        await googlePost(localData);
        await new Promise(r=>setTimeout(r,900));
        const afterUpload = await googleGet();
        database = afterUpload;
        drawTable();
        setGoogleStatus("green","GOOGLE CONNECTED");
        return;
      }
    }

    database = googleData;
    drawTable();
    setGoogleStatus("green","GOOGLE CONNECTED");
  }catch(err){
    console.error(err);
    database = [];
    drawTable();
    setGoogleStatus("red","GOOGLE NOT CONNECTED");
  }finally{
    toggleLoading(false);
  }
}

function openScriptModal(){
document.getElementById("scriptText").value=GOOGLE_SCRIPT.trim();
document.getElementById("scriptModal").style.display="flex";
}
function closeScriptModal(){document.getElementById("scriptModal").style.display="none"}

async function copyGoogleScript(){
const text=document.getElementById("scriptText").value;
try{await navigator.clipboard.writeText(text);alert("Google Apps Script copy செய்யப்பட்டது.")}
catch(e){
const box=document.getElementById("scriptText");box.focus();box.select();document.execCommand("copy");
alert("Script copy செய்யப்பட்டது.");
}
}

updateModeButtons();
if(currentMode === "google"){
  database = [];
  drawTable();
  if(googleConfigured()) checkGoogleConnection();
  else setGoogleStatus("red","GOOGLE NOT CONNECTED");
}else{
  loadLocalOnly();
  setGoogleStatus("","LOCAL MODE");
}
</script>
